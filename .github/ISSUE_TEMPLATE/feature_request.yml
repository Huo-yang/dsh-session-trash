name: 功能建议 / Feature request
description: 说明使用场景和期望行为 / Describe a use case and desired behavior
title: '[Feature] '
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景 / Use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望行为 / Desired behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 当前解决办法 / Current workaround
